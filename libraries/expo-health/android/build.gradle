plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.healthspec.expo'
version = '0.0.0'

android {
  namespace "dev.healthspec.expo"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    // Health Connect's client library requires API 26. The config plugin raises the app's minSdkVersion to match.
    minSdkVersion 26
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // Kotlin stdlib and kotlinx-coroutines come from expo-modules-core as `api` dependencies.
  // The dev.healthspec sources next to this module are copied from packages/google by `pnpm codegen`, so the npm
  // package is self-contained; the Health Connect client they compile against is declared here.
  api "androidx.health.connect:connect-client:1.1.0"
}
