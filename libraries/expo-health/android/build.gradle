plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.healthspec.expo'
version = '0.0.0'

android {
  namespace "dev.healthspec.expo"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    // Health Connect's client library requires API 26. Apps must raise their own minSdkVersion to match
    // (expo-build-properties: { android: { minSdkVersion: 26 } }), otherwise the manifest merger fails
    // with a clear message pointing here.
    minSdkVersion 26
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // Kotlin stdlib and kotlinx-coroutines come from expo-modules-core as `api` dependencies.
  // The Health Connect mapping, serialization and aggregation live in the shared package so that
  // plain Android projects can use them without React Native.
  api project(':healthspec')
}
