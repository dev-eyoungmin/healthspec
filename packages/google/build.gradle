plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'maven-publish'
}

group = 'dev.healthspec'
version = rootProject.hasProperty('healthspecVersion') ? rootProject.healthspecVersion : '0.0.0'

android {
  namespace 'dev.healthspec'
  compileSdk 35
  defaultConfig {
    // Health Connect's client library requires API 26.
    minSdk 26
  }
  kotlinOptions { jvmTarget = '17' }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  publishing { singleVariant('release') { withSourcesJar() } }
}

dependencies {
  api "androidx.health.connect:connect-client:1.1.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}

publishing {
  publications {
    release(MavenPublication) {
      afterEvaluate { from components.release }
      artifactId = 'healthspec'
      pom {
        name = 'HealthSpec for Android'
        description = 'Health Connect implementation of the HealthSpec specification.'
        url = 'https://healthspec.dev'
        licenses { license { name = 'MIT'; url = 'https://opensource.org/licenses/MIT' } }
      }
    }
  }
}
